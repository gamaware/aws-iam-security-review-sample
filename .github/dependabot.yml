version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: terraform
    directories:
      - /data/synthetic/before/terraform
      - /remediation/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
