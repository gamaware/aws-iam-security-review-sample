name: update pre-commit hooks

# Weekly `pre-commit autoupdate --freeze`, opened as a pull request. PRE_COMMIT_PAT (a
# fine-grained token) is used instead of GITHUB_TOKEN so that the pull request triggers CI.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-pre-commit-hooks
  cancel-in-progress: true

jobs:
  update:
    name: Update pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # "automation" has no protection rules; it keeps the secret inside a job environment.
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Update hooks
        run: uvx pre-commit==4.3.0 autoupdate --freeze

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PRE_COMMIT_PAT }}
          branch: chore/update-pre-commit-hooks
          commit-message: "chore: update pre-commit hooks"
          title: "chore: update pre-commit hooks"
          body: Weekly `pre-commit autoupdate --freeze`. Review each hook's changelog before merging.
          delete-branch: true
