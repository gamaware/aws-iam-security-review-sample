language: en-US
reviews:
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "data/synthetic/before/**"
      instructions: >
        Intentionally insecure FICTIONAL fixture. Do not suggest fixes here; fixes belong in
        remediation/ and data/synthetic/after/. Flag only real account IDs, names or secrets.
    - path: "remediation/**"
      instructions: >
        Least-privilege fixes. Flag wildcard actions or resources, missing conditions, trust
        policies wider than one repository and environment, and any drift between
        remediation/policies/*.json and the Terraform.
    - path: "evidence/**"
      instructions: >
        Generated by `make evidence`. Changes must come with the matching report update; hand
        edits are a defect.
    - path: "report/**"
      instructions: >
        Client deliverable. Check that quoted tool output matches evidence/, counts agree, finding
        IDs are consistent with control-evidence-map.md, and the fictional label stays. Neutral
        voice, no marketing language, no compliance opinions.
    - path: "scripts/**/*.py"
      instructions: >
        Python standard library only; no network or AWS SDK calls. Check exit codes and ruff rules.
    - path: "**/*.sh"
      instructions: >
        Must pass shellcheck and shellharden; quote all variables. test-live.sh may only make
        read or evaluate AWS calls.
    - path: ".github/workflows/**"
      instructions: >
        permissions: {} at workflow level, per-job grants, actions pinned by full SHA, timeouts,
        no pull_request_target, no cloud credentials or id-token in PR jobs.
    - path: "**/*.md"
      instructions: >
        Line length 120 (tables exempt), sentence-case headings, relative links that resolve,
        AWS documentation example account IDs only.
  path_filters:
    - "!**/*.png"
    - "!docs/diagrams/*.drawio"
chat:
  auto_reply: true
