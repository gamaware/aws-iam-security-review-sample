name: ci

# Every job is offline: no AWS credentials, no id-token, no secrets. `verify` runs the
# same `make verify` a reviewer runs locally; the shared jobs come from gamaware/.github.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Tests, reviews, Checkov gates, Terraform and evidence reproducibility
        run: make verify

  # Builds the client PDF from report/REPORT.md (ADR 0005). Kept in this repository until the
  # shared report workflow's inputs are settled.
  report:
    name: Report PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: "0.15.1"

      # Ubuntu's pandoc 3.1 template does not work with current typst; install a pinned release.
      - name: Install pandoc 3.11
        env:
          PANDOC_DEB: pandoc-3.11-1-amd64.deb
          PANDOC_SHA256: 89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99
        run: |
          curl -sSfLO "https://github.com/jgm/pandoc/releases/download/3.11/$PANDOC_DEB"
          echo "$PANDOC_SHA256  $PANDOC_DEB" | sha256sum --check
          sudo dpkg -i "$PANDOC_DEB"

      - name: Render the report
        run: make report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: REPORT
          path: build/REPORT.pdf
          if-no-files-found: error
          retention-days: 30

  hygiene:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: Install shellharden and terraform-docs
        run: |
          cargo install shellharden --version 4.3.2 --locked
          go install github.com/terraform-docs/terraform-docs@v0.24.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Terraform validate and Checkov already run inside `make verify`.
      - name: pre-commit
        env:
          SKIP: no-commit-to-branch,terraform_validate,checkov
        run: uvx pre-commit==4.3.0 run --all-files --show-diff-on-failure

  lint-docs:
    name: lint-docs
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@main

  lint-actions:
    name: lint-actions
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@main

  secrets:
    name: secrets
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@main

  security:
    name: security
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: gamaware/.github/.github/workflows/security.yml@main
