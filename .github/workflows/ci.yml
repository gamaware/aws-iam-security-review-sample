name: ci

# Every job is offline: no AWS credentials, no id-token, no secrets. `verify` runs the
# same `make verify` a reviewer runs locally; the shared jobs come from gamaware/.github.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Tests, reviews, Checkov gates, Terraform and evidence reproducibility
        run: make verify

  hygiene:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: Install shellharden and terraform-docs
        run: |
          cargo install shellharden --version 4.3.2 --locked
          go install github.com/terraform-docs/terraform-docs@v0.24.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Terraform validate and Checkov already run inside `make verify`.
      - name: pre-commit
        env:
          SKIP: no-commit-to-branch,terraform_validate,checkov
        run: uvx pre-commit==4.3.0 run --all-files --show-diff-on-failure

  # Shared jobs from gamaware/.github, pinned by commit SHA. They get read-only contents and
  # no secrets.
  lint-docs:
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)

  lint-actions:
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)

  secrets:
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)

  # Semgrep honors .semgrepignore, Checkov reads .github/checkov-ci.yaml and Trivy gets
  # trivy-skip-dirs; each leaves out only the intentionally insecure before fixture, whose
  # findings `make verify` asserts (ADR 0004). The Checkov file is not at the root, where
  # Checkov would load it automatically and hide the before findings from `make checkov`.
  security:
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/security.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    with:
      trivy-skip-dirs: data/synthetic/before
      checkov-config: .github/checkov-ci.yaml

  # Renders report/REPORT.md with the control map as its appendix (ADR 0005).
  report:
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/report.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    with:
      report-path: report/REPORT.md
      pandoc-args: control-evidence-map.md --pdf-engine=xelatex -V geometry:margin=2.2cm --toc
      artifact-name: REPORT
